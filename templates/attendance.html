{% extends "base.html" %}
{% block title %}Attendance{% endblock %}
{% block content %}
<h1>Attendance</h1>

<form method="POST" class="form-box">
    <label>Date</label>
    <input type="date" name="date" value="{{ today }}" required>

    <label>Subject</label>
    <input type="text" name="subject" placeholder="e.g. Python" required>

    <table class="data-table">
        <thead>
            <tr><th>Roll No</th><th>Name</th><th>Current Attendance %</th><th>Present / Absent</th></tr>
        </thead>
        <tbody>
        {% for s in students %}
            <tr>
                <td>{{ s.roll_no }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.attendance }}%</td>
                <td>
                    <label class="radio-inline">
                        <input type="radio" name="status_{{ s.id }}" value="Present" checked> Present
                    </label>
                    <label class="radio-inline">
                        <input type="radio" name="status_{{ s.id }}" value="Absent"> Absent
                    </label>
                </td>
            </tr>
        {% else %}
            <tr><td colspan="4" class="muted">No students yet. Add students first.</td></tr>
        {% endfor %}
        </tbody>
    </table>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Attendance</button>
    </div>
</form>
{% endblock %}
